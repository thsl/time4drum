
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metrônomo Avançado para Bateria</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101412;
      --panel: #171d1a;
      --panel-soft: #202822;
      --ink: #edf6f0;
      --muted: #9dafaa;
      --line: #334039;
      --accent: #35caa4;
      --accent-2: #ff7a54;
      --accent-3: #7aa7ff;
      --warn: #ffc15a;
      --shadow: 0 18px 45px rgba(0, 0, 0, .28);
      --radius: 8px;
      --flash: rgba(53, 202, 164, .18);
      --grid: #2a342e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(15,143,114,.08), transparent 35%),
        linear-gradient(315deg, rgba(212,79,47,.07), transparent 38%),
        var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 7px;
      min-height: 42px;
      padding: 0 14px;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }

    button:hover { border-color: var(--accent); }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: not-allowed; opacity: .55; }

    input, select, textarea {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      color: var(--ink);
      padding: 8px 10px;
    }

    input[type="range"] {
      min-height: 32px;
      padding: 0;
      accent-color: var(--accent);
    }

    input[type="checkbox"] {
      width: 18px;
      min-height: 18px;
      accent-color: var(--accent);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 650;
    }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel-pad { padding: 16px; }

    .stack { display: grid; gap: 14px; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0;
    }

    .control-grid {
      display: grid;
      grid-template-columns: clamp(120px, 36vw, 260px) minmax(0, 1fr);
      gap: clamp(12px, 3vw, 24px);
      align-items: center;
    }

    .control-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-items: end;
    }

    .control-fields .wide {
      grid-column: 1 / -1;
    }

    .bpm-display {
      display: grid;
      place-items: center;
      width: 100%;
      max-width: 260px;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, var(--flash), transparent 62%),
        var(--panel-soft);
      border: 1px solid var(--line);
      transition: background .08s linear, transform .08s linear;
    }

    .bpm-display.flash {
      background:
        radial-gradient(circle at center, rgba(255,255,255,.34), transparent 60%),
        var(--flash),
        var(--panel-soft);
      transform: scale(1.01);
    }

    .bpm-number {
      font-size: clamp(4rem, 13vw, 6.8rem);
      font-weight: 850;
      line-height: .9;
      font-variant-numeric: tabular-nums;
    }

    .bpm-unit {
      color: var(--muted);
      font-weight: 750;
      letter-spacing: .08em;
    }

    .bpm-controls {
      display: grid;
      gap: 10px;
      align-items: center;
    }

    .transport {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .transport button {
      min-height: 54px;
      font-size: 1.02rem;
    }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 800;
    }

    .danger {
      border-color: color-mix(in srgb, var(--accent-2), var(--line) 25%);
      color: var(--accent-2);
      font-weight: 750;
    }

    .ghost {
      background: var(--panel-soft);
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .status {
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px 10px;
      background: var(--panel-soft);
    }

    .status span {
      display: block;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .status strong {
      display: block;
      font-size: .95rem;
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }

    .progress-wrap {
      height: 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      overflow: hidden;
      background: var(--panel-soft);
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .04s linear;
    }

    .rhythm-grid {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-soft);
    }

    .beat-row {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 8px;
      align-items: center;
    }

    .beat-label {
      color: var(--muted);
      font-weight: 850;
      text-align: center;
    }

    .pulse-row {
      display: grid;
      gap: 8px;
      justify-items: center;
      align-items: center;
    }

    .pulse {
      width: 22px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid var(--grid);
      background: var(--panel);
      transition: background .06s linear, color .06s linear, transform .06s linear;
    }

    .pulse.active {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.24);
    }

    .pulse.fill {
      border-color: var(--warn);
      box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--warn), transparent 55%);
    }

    .pulse.active.fill {
      background: var(--warn);
    }

    .editor-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      background: var(--panel);
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: .78rem;
      background: var(--panel-soft);
      white-space: nowrap;
    }

    tr.active-measure td {
      background: color-mix(in srgb, var(--accent), transparent 88%);
    }

    td input, td select { min-width: 82px; }

    .row-actions {
      display: flex;
      gap: 6px;
      white-space: nowrap;
    }

    .row-actions button {
      min-height: 34px;
      min-width: 36px;
      padding: 0 8px;
    }

    .count-in {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.22);
      z-index: 20;
      pointer-events: none;
    }

    .count-in.show { display: grid; }

    .count-bubble {
      width: min(42vw, 260px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--panel);
      border: 3px solid var(--accent);
      color: var(--accent);
      font-size: clamp(4rem, 18vw, 9rem);
      font-weight: 900;
      box-shadow: var(--shadow);
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.4;
    }

    .toggle-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .toggle-line:last-child { border-bottom: 0; }

    .toggle-line label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: .92rem;
    }

    .small-value {
      color: var(--muted);
      font-weight: 750;
      font-size: .82rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .bpm-display { justify-self: start; }
    }

    @media (max-width: 620px) {
      .app { padding: 6px; }
      .panel-pad { padding: 14px 16px; }
      label { font-size: .72rem; gap: 5px; }
      input, select {
        min-height: 38px;
        padding: 7px 9px;
        font-size: .84rem;
      }
      input[type="range"] { min-height: 24px; }
      .stack { gap: 12px; }
      .control-grid {
        grid-template-columns: minmax(118px, 38%) minmax(0, 1fr);
        gap: 12px;
        align-items: center;
      }
      .control-fields {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }
      .bpm-number { font-size: clamp(3.2rem, 15vw, 5rem); }
      .bpm-unit {
        font-size: .82rem;
        letter-spacing: .06em;
      }
      .transport button {
        min-height: 52px;
        font-size: .98rem;
      }
      .section-title { margin-bottom: 8px; }
      h2 { font-size: .95rem; }
      .rhythm-grid { padding: 10px; gap: 8px; }
      .pulse { width: 20px; }
      .status-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .status { padding: 7px; }
      .status span { font-size: .58rem; }
      .status strong { font-size: .78rem; }
    }

    @media (max-width: 370px) {
      .control-grid { grid-template-columns: 1fr; }
      .bpm-display {
        width: min(190px, 100%);
        justify-self: center;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="layout">
      <section class="panel panel-pad stack">
        <div class="control-grid">
          <div id="bpmFlash" class="bpm-display" aria-live="polite">
            <div>
              <div id="bpmBig" class="bpm-number">120</div>
              <div class="bpm-unit">BPM</div>
            </div>
          </div>

          <div class="control-fields">
            <label>BPM
              <input id="bpmInput" type="number" min="30" max="300" step="1" value="120">
            </label>
            <label>Count-in
              <select id="countInSelect">
                <option value="0">0</option>
                <option value="1">1 compasso</option>
                <option value="2">2 compassos</option>
              </select>
            </label>
            <label class="wide">
              <span class="sr-only">BPM</span>
              <input id="bpmSlider" type="range" min="30" max="300" step="1" value="120">
            </label>
            <label class="wide">Timbre
              <select id="soundSelect">
                <option value="electronic">Click suave</option>
                <option value="woodblock">Woodblock seco</option>
                <option value="cowbell">Cowbell macio</option>
              </select>
            </label>
          </div>
        </div>

        <div class="transport">
          <button id="startBtn" class="primary" type="button">Start</button>
        </div>

        <div class="section-title">
          <h2>Grade Rítmica</h2>
          <span id="signatureStatus" class="small-value">4/4</span>
        </div>
        <div class="progress-wrap" aria-label="Posição no ciclo">
          <div id="cycleProgress" class="progress"></div>
        </div>
        <div id="rhythmGrid" class="rhythm-grid"></div>
      </section>

      <section class="panel panel-pad">
        <div class="status-grid">
          <div class="status"><span>Tempo</span><strong id="beatStatus">1</strong></div>
          <div class="status"><span>Ciclo</span><strong id="cycleStatus">1</strong></div>
          <div class="status"><span>Compasso</span><strong id="measureStatus">1 / 5</strong></div>
          <div class="status"><span>Subdivisão</span><strong id="subdivisionStatus">Semínimas</strong></div>
        </div>
      </section>

      <section class="panel panel-pad stack">
        <div class="editor-head">
          <h2>Editor de Sequência</h2>
          <div class="button-row">
            <button id="addMeasure" type="button">Adicionar</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Tempos</th>
                <th>Denominador</th>
                <th>Subdivisão</th>
                <th>Repetições</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="sequenceBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="countInOverlay" class="count-in" aria-hidden="true">
    <div id="countInNumber" class="count-bubble">4</div>
  </div>

  <script>
    "use strict";

    const STORAGE_KEY = "drumAdvancedMetronome.v1";
    const LOOK_AHEAD_MS = 25;
    const SCHEDULE_AHEAD_SECONDS = 0.1;
    const BPM_MIN = 30;
    const BPM_MAX = 300;

    const SUBDIVISIONS = {
      1: { label: "Semínimas" },
      2: { label: "Colcheias" },
      3: { label: "Tercinas" },
      4: { label: "Semicolcheias" },
      6: { label: "Sextinas" },
      8: { label: "Fusas" }
    };

    const DEFAULT_SEQUENCE = [1, 2, 3, 4, 6, 8].map(subdivision => ({
      beats: 4,
      denominator: 4,
      subdivision,
      repeats: 1
    }));

    class AudioEngine {
      constructor() {
        this.context = null;
        this.master = null;
        this.comp = null;
        this.noiseBuffer = null;
        this.volume = 0.72;
        this.timbre = "electronic";
      }

      async ensure() {
        if (!this.context) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.context = new AudioContextClass();
          this.master = this.context.createGain();
          this.comp = this.context.createDynamicsCompressor();
          this.master.gain.value = this.volume;
          this.comp.threshold.value = -18;
          this.comp.knee.value = 18;
          this.comp.ratio.value = 3;
          this.comp.attack.value = 0.003;
          this.comp.release.value = 0.08;
          this.master.connect(this.comp);
          this.comp.connect(this.context.destination);
        }
        if (this.context.state === "suspended") {
          await this.context.resume();
        }
      }

      get currentTime() {
        return this.context ? this.context.currentTime : 0;
      }

      setVolume(value) {
        this.volume = clamp(Number(value), 0, 1);
        if (this.master && this.context) {
          this.master.gain.setTargetAtTime(this.volume, this.context.currentTime, 0.01);
        }
      }

      setTimbre(value) {
        this.timbre = value;
      }

      scheduleClick(time, type) {
        if (!this.context || !this.master) return;
        if (this.timbre === "woodblock") this.scheduleWoodblock(time, type);
        else if (this.timbre === "cowbell") this.scheduleCowbell(time, type);
        else this.scheduleElectronic(time, type);
      }

      envelopeGain(time, peak, attack, decay, destination = this.master) {
        // O envelope é agendado no relógio do AudioContext, não no relógio da tela.
        const gain = this.context.createGain();
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(peak, time + attack);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + attack + decay);
        gain.connect(destination);
        return gain;
      }

      getNoiseBuffer() {
        if (this.noiseBuffer) return this.noiseBuffer;
        const length = Math.floor(this.context.sampleRate * 0.08);
        const buffer = this.context.createBuffer(1, length, this.context.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / length);
        }
        this.noiseBuffer = buffer;
        return buffer;
      }

      scheduleNoise(time, peak, decay, filterType, frequency, q, destination = this.master) {
        const source = this.context.createBufferSource();
        const filter = this.context.createBiquadFilter();
        const gain = this.envelopeGain(time, peak, 0.001, decay, destination);
        source.buffer = this.getNoiseBuffer();
        filter.type = filterType;
        filter.frequency.setValueAtTime(frequency, time);
        filter.Q.setValueAtTime(q, time);
        source.connect(filter);
        filter.connect(gain);
        source.start(time);
        source.stop(time + decay + 0.02);
      }

      scheduleElectronic(time, type) {
        const cfg = {
          downbeat: [1180, 0.58, 0.046, 2400],
          strong: [920, 0.45, 0.038, 2100],
          weak: [720, 0.34, 0.032, 1800],
          subdivision: [540, 0.18, 0.018, 1400],
          count: [880, 0.28, 0.03, 1900]
        }[type] || [700, 0.3, 0.03, 1700];

        const lowpass = this.context.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.setValueAtTime(cfg[3], time);
        lowpass.Q.setValueAtTime(0.2, time);

        const osc = this.context.createOscillator();
        const gain = this.envelopeGain(time, cfg[1], 0.0015, cfg[2], lowpass);
        osc.type = "triangle";
        osc.frequency.setValueAtTime(cfg[0], time);
        osc.connect(gain);
        lowpass.connect(this.master);
        osc.start(time);
        osc.stop(time + cfg[2] + 0.02);
        this.scheduleNoise(time, cfg[1] * 0.08, Math.min(cfg[2], 0.02), "highpass", 1800, 0.7);
      }

      scheduleWoodblock(time, type) {
        const cfg = {
          downbeat: [520, 760, 0.62, 0.075, 1250],
          strong: [470, 690, 0.48, 0.062, 1120],
          weak: [410, 610, 0.34, 0.052, 980],
          subdivision: [330, 495, 0.17, 0.033, 850],
          count: [455, 665, 0.28, 0.048, 1050]
        }[type] || [420, 630, 0.26, 0.042, 980];

        const body = this.context.createBiquadFilter();
        body.type = "bandpass";
        body.frequency.setValueAtTime(cfg[4], time);
        body.Q.setValueAtTime(1.1, time);
        body.connect(this.master);
        const gain = this.envelopeGain(time, cfg[2], 0.001, cfg[3], body);
        [cfg[0], cfg[1]].forEach((freq, index) => {
          const osc = this.context.createOscillator();
          osc.type = index ? "sine" : "triangle";
          osc.frequency.setValueAtTime(freq, time);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.92, time + cfg[3]);
          osc.connect(gain);
          osc.start(time);
          osc.stop(time + cfg[3] + 0.03);
        });
        this.scheduleNoise(time, cfg[2] * 0.12, Math.min(cfg[3], 0.04), "bandpass", cfg[4] * 1.6, 1.4);
      }

      scheduleCowbell(time, type) {
        const cfg = {
          downbeat: [520, 800, 0.48, 0.115, 2600],
          strong: [500, 750, 0.38, 0.09, 2300],
          weak: [470, 705, 0.28, 0.075, 2050],
          subdivision: [390, 585, 0.14, 0.045, 1600],
          count: [500, 750, 0.24, 0.065, 2100]
        }[type] || [450, 675, 0.24, 0.055, 1900];

        const band = this.context.createBiquadFilter();
        band.type = "bandpass";
        band.frequency.setValueAtTime(cfg[4], time);
        band.Q.setValueAtTime(1.7, time);
        const lowpass = this.context.createBiquadFilter();
        lowpass.type = "lowpass";
        lowpass.frequency.setValueAtTime(3600, time);
        lowpass.Q.setValueAtTime(0.4, time);
        const gain = this.envelopeGain(time, cfg[2], 0.002, cfg[3], lowpass);
        band.connect(gain);
        lowpass.connect(this.master);
        [cfg[0], cfg[1]].forEach(freq => {
          const osc = this.context.createOscillator();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, time);
          osc.connect(band);
          osc.start(time);
          osc.stop(time + cfg[3] + 0.04);
        });
        this.scheduleNoise(time, cfg[2] * 0.07, Math.min(cfg[3], 0.045), "bandpass", cfg[4], 1.2);
      }
    }

    class Sequencer {
      constructor(audio, onEvent, onStop) {
        this.audio = audio;
        this.onEvent = onEvent;
        this.onStop = onStop;
        this.timerId = null;
        this.isRunning = false;
        this.isPaused = false;
        this.sequence = [];
        this.bpm = 120;
        this.countInMeasures = 0;
        this.resetCursor();
      }

      setSettings(settings) {
        this.bpm = clampInt(settings.bpm ?? this.bpm, BPM_MIN, BPM_MAX);
        this.countInMeasures = Math.max(0, parseInt(settings.countInMeasures || 0, 10));
      }

      setSequence(sequence) {
        this.sequence = sanitizeSequence(sequence);
        if (this.measureIndex >= this.sequence.length) this.resetCursor();
      }

      resetCursor() {
        this.measureIndex = 0;
        this.repeatIndex = 0;
        this.pulseIndex = 0;
        this.cycleIndex = 0;
        this.nextNoteTime = 0;
        this.currentEvent = null;
      }

      async start({ restart = false } = {}) {
        await this.audio.ensure();
        if (restart) this.resetCursor();
        if (this.isRunning) return;
        this.isRunning = true;
        this.isPaused = false;
        const countInSeconds = this.countInMeasures > 0 ? this.scheduleCountIn() : 0;
        this.nextNoteTime = this.audio.currentTime + 0.05 + countInSeconds;
        this.scheduler();
      }

      pause() {
        if (!this.isRunning) return;
        this.clearTimer();
        this.isRunning = false;
        this.isPaused = true;
      }

      stop({ reset = true } = {}) {
        this.clearTimer();
        this.isRunning = false;
        this.isPaused = false;
        if (reset) this.resetCursor();
        this.onStop?.();
      }

      clearTimer() {
        if (this.timerId) {
          clearTimeout(this.timerId);
          this.timerId = null;
        }
      }

      scheduleCountIn() {
        const firstMeasure = this.sequence[0] || defaultMeasure();
        const beatDuration = this.getBeatDuration(firstMeasure);
        const countBeats = firstMeasure.beats * this.countInMeasures;
        const start = this.audio.currentTime + 0.05;
        for (let i = 0; i < countBeats; i++) {
          const beatNumber = (i % firstMeasure.beats) + 1;
          const time = start + i * beatDuration;
          this.audio.scheduleClick(time, beatNumber === 1 ? "downbeat" : "count");
          this.onEvent({
            type: "count",
            time,
            countNumber: firstMeasure.beats - (i % firstMeasure.beats)
          });
        }
        return countBeats * beatDuration;
      }

      scheduler() {
        if (!this.isRunning) return;
        // Scheduler look-ahead: a rotina acorda a cada 25 ms e agenda 100 ms de áudio.
        // Os cliques já ficam na timeline do Web Audio, reduzindo jitter em BPMs altos.
        const horizon = this.audio.currentTime + SCHEDULE_AHEAD_SECONDS;
        while (this.nextNoteTime < horizon && this.isRunning) {
          this.scheduleCurrentPulse();
          this.advancePulse();
        }
        this.timerId = setTimeout(() => this.scheduler(), LOOK_AHEAD_MS);
      }

      scheduleCurrentPulse() {
        const measure = this.sequence[this.measureIndex] || defaultMeasure();
        const subdivision = measure.subdivision;
        const beatNumber = Math.floor(this.pulseIndex / subdivision) + 1;
        const subIndex = this.pulseIndex % subdivision;
        const pulseInMeasure = this.pulseIndex + 1;
        const totalPulses = measure.beats * subdivision;
        const clickType = this.getClickType(measure, beatNumber, subIndex);

        this.audio.scheduleClick(this.nextNoteTime, clickType);
        const event = {
          type: "pulse",
          time: this.nextNoteTime,
          measureIndex: this.measureIndex,
          repeatIndex: this.repeatIndex,
          cycleIndex: this.cycleIndex,
          pulseIndex: this.pulseIndex,
          pulseInMeasure,
          totalPulses,
          beatNumber,
          subIndex,
          clickType,
          measure: { ...measure }
        };
        this.currentEvent = event;
        this.onEvent?.(event);
      }

      getClickType(measure, beatNumber, subIndex) {
        if (subIndex > 0) return "subdivision";
        if (beatNumber === 1) return "downbeat";
        if (measure.beats === 4 && beatNumber === 3) return "strong";
        if (measure.beats > 4 && beatNumber % 2 === 1) return "strong";
        return "weak";
      }

      advancePulse() {
        const measure = this.sequence[this.measureIndex] || defaultMeasure();
        const subdivision = measure.subdivision;
        this.nextNoteTime += this.getBeatDuration(measure) / subdivision;
        this.pulseIndex += 1;

        if (this.pulseIndex < measure.beats * subdivision) return;

        this.pulseIndex = 0;
        this.repeatIndex += 1;
        if (this.repeatIndex < measure.repeats) return;

        this.repeatIndex = 0;
        this.measureIndex += 1;
        if (this.measureIndex < this.sequence.length) return;

        this.measureIndex = 0;
        this.cycleIndex += 1;
      }

      getBeatDuration(measure) {
        return (60 / this.bpm) * (4 / measure.denominator);
      }

      getSnapshot() {
        const measure = this.sequence[this.measureIndex] || defaultMeasure();
        return {
          isRunning: this.isRunning,
          isPaused: this.isPaused,
          measureIndex: this.measureIndex,
          repeatIndex: this.repeatIndex,
          pulseIndex: this.pulseIndex,
          cycleIndex: this.cycleIndex,
          measure: { ...measure },
          currentEvent: this.currentEvent
        };
      }
    }

    class AppUI {
      constructor() {
        this.audio = new AudioEngine();
        this.state = this.loadState();
        this.scheduledEvents = [];
        this.lastVisualPulseKey = "";
        this.flashUntil = 0;
        this.countOverlayUntil = 0;
        this.cacheElements();
        this.sequencer = new Sequencer(
          this.audio,
          event => this.handleScheduledEvent(event),
          () => this.handleStopped()
        );
        this.applyStateToEngine();
        this.bindEvents();
        this.renderAll();
        this.animationLoop();
      }

      cacheElements() {
        this.els = {
          bpmBig: document.getElementById("bpmBig"),
          bpmFlash: document.getElementById("bpmFlash"),
          bpmInput: document.getElementById("bpmInput"),
          bpmSlider: document.getElementById("bpmSlider"),
          soundSelect: document.getElementById("soundSelect"),
          countInSelect: document.getElementById("countInSelect"),
          startBtn: document.getElementById("startBtn"),
          measureStatus: document.getElementById("measureStatus"),
          beatStatus: document.getElementById("beatStatus"),
          subdivisionStatus: document.getElementById("subdivisionStatus"),
          cycleStatus: document.getElementById("cycleStatus"),
          signatureStatus: document.getElementById("signatureStatus"),
          cycleProgress: document.getElementById("cycleProgress"),
          rhythmGrid: document.getElementById("rhythmGrid"),
          sequenceBody: document.getElementById("sequenceBody"),
          addMeasure: document.getElementById("addMeasure"),
          countInOverlay: document.getElementById("countInOverlay"),
          countInNumber: document.getElementById("countInNumber")
        };
      }

      loadState() {
        const fallback = {
          bpm: 120,
          timbre: "electronic",
          sequence: DEFAULT_SEQUENCE,
          countInMeasures: 0
        };
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!saved) return fallback;
          return {
            ...fallback,
            ...saved,
            sequence: sanitizeSequence(saved.sequence || fallback.sequence)
          };
        } catch {
          return fallback;
        }
      }

      saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          bpm: this.state.bpm,
          timbre: this.state.timbre,
          sequence: this.state.sequence,
          countInMeasures: this.state.countInMeasures
        }));
      }

      applyStateToEngine() {
        this.audio.setTimbre(this.state.timbre);
        this.sequencer.setSettings(this.state);
        this.sequencer.setSequence(this.state.sequence);
      }

      bindEvents() {
        this.els.bpmInput.addEventListener("input", e => this.setBpm(e.target.value));
        this.els.bpmSlider.addEventListener("input", e => this.setBpm(e.target.value));
        this.els.soundSelect.addEventListener("change", e => {
          this.state.timbre = e.target.value;
          this.audio.setTimbre(this.state.timbre);
          this.saveState();
        });
        this.els.countInSelect.addEventListener("change", e => {
          this.state.countInMeasures = parseInt(e.target.value, 10);
          this.applyStateToEngine();
          this.saveState();
        });
        this.els.startBtn.addEventListener("click", () => this.toggleTransport());
        this.els.addMeasure.addEventListener("click", () => this.addMeasure());
        document.addEventListener("keydown", e => this.handleKeys(e));
      }

      setBpm(value) {
        this.state.bpm = clampInt(value, BPM_MIN, BPM_MAX);
        this.sequencer.bpm = this.state.bpm;
        this.renderBpm();
        this.saveState();
      }

      async toggleTransport() {
        if (this.sequencer.isRunning) {
          this.sequencer.pause();
          this.updateTransportLabel();
          return;
        }
        this.applyStateToEngine();
        await this.sequencer.start();
        this.updateTransportLabel();
      }

      updateTransportLabel() {
        this.els.startBtn.textContent = this.sequencer.isRunning ? "Stop" : "Start";
      }

      handleKeys(event) {
        const tag = event.target.tagName.toLowerCase();
        if (tag === "input" || tag === "textarea" || tag === "select") return;
        if (event.code === "Space") {
          event.preventDefault();
          this.toggleTransport();
        }
      }

      handleScheduledEvent(event) {
        // A interface recebe eventos já agendados, mas nunca decide quando o áudio toca.
        this.scheduledEvents.push(event);
        this.scheduledEvents = this.scheduledEvents.slice(-128);
      }

      handleStopped() {
        this.renderStatus();
        this.updateTransportLabel();
      }

      addMeasure() {
        const last = this.state.sequence[this.state.sequence.length - 1] || defaultMeasure();
        this.state.sequence.push({ ...last });
        this.applyStateToEngine();
        this.renderSequenceTable();
        this.renderRhythmGrid();
        this.saveState();
      }

      updateMeasure(index, patch) {
        const next = this.state.sequence.map((measure, i) => i === index ? sanitizeMeasure({ ...measure, ...patch }) : measure);
        this.state.sequence = sanitizeSequence(next);
        this.applyStateToEngine();
        this.renderSequenceTable();
        this.renderRhythmGrid();
        this.saveState();
      }

      removeMeasure(index) {
        if (this.state.sequence.length <= 1) return;
        this.state.sequence.splice(index, 1);
        this.applyStateToEngine();
        this.renderSequenceTable();
        this.renderRhythmGrid();
        this.saveState();
      }

      duplicateMeasure(index) {
        this.state.sequence.splice(index + 1, 0, { ...this.state.sequence[index] });
        this.applyStateToEngine();
        this.renderSequenceTable();
        this.saveState();
      }

      moveMeasure(index, direction) {
        const target = index + direction;
        if (target < 0 || target >= this.state.sequence.length) return;
        const [item] = this.state.sequence.splice(index, 1);
        this.state.sequence.splice(target, 0, item);
        this.applyStateToEngine();
        this.renderSequenceTable();
        this.saveState();
      }

      renderAll() {
        this.renderBpm();
        this.renderControls();
        this.renderStatus();
        this.renderRhythmGrid();
        this.renderSequenceTable();
      }

      renderBpm() {
        this.els.bpmBig.textContent = this.state.bpm;
        this.els.bpmInput.value = this.state.bpm;
        this.els.bpmSlider.value = this.state.bpm;
      }

      renderControls() {
        this.els.soundSelect.value = this.state.timbre;
        this.els.countInSelect.value = String(this.state.countInMeasures);
        this.updateTransportLabel();
      }

      renderStatus(event = this.sequencer.getSnapshot().currentEvent) {
        const snap = this.sequencer.getSnapshot();
        const measure = event?.measure || snap.measure || defaultMeasure();
        const measureNumber = (event?.measureIndex ?? snap.measureIndex) + 1;
        const beatNumber = event?.beatNumber || Math.floor((snap.pulseIndex || 0) / measure.subdivision) + 1;
        this.els.measureStatus.textContent = `${measureNumber} / ${this.state.sequence.length}`;
        this.els.beatStatus.textContent = `${beatNumber}${event ? `.${event.subIndex + 1}` : ""}`;
        this.els.subdivisionStatus.textContent = SUBDIVISIONS[measure.subdivision].label;
        this.els.signatureStatus.textContent = `${measure.beats}/${measure.denominator}`;
        const cycle = (event?.cycleIndex ?? snap.cycleIndex) + 1;
        this.els.cycleStatus.textContent = String(cycle);
        this.highlightActiveRow(measureNumber - 1);
      }

      renderSequenceTable() {
        this.els.sequenceBody.innerHTML = "";
        this.state.sequence.forEach((measure, index) => {
          const tr = document.createElement("tr");
          tr.dataset.index = index;
          tr.innerHTML = `
            <td><strong>${index + 1}</strong></td>
            <td><input type="number" min="1" max="16" step="1" value="${measure.beats}" data-field="beats" aria-label="Tempos do compasso ${index + 1}"></td>
            <td>
              <select data-field="denominator" aria-label="Denominador do compasso ${index + 1}">
                ${[2, 4, 8, 16].map(value => `<option value="${value}" ${value === measure.denominator ? "selected" : ""}>${value}</option>`).join("")}
              </select>
            </td>
            <td>
              <select data-field="subdivision" aria-label="Subdivisão do compasso ${index + 1}">
                ${Object.entries(SUBDIVISIONS).map(([value, info]) => `<option value="${value}" ${Number(value) === measure.subdivision ? "selected" : ""}>${value} · ${info.label}</option>`).join("")}
              </select>
            </td>
            <td><input type="number" min="1" max="64" step="1" value="${measure.repeats}" data-field="repeats" aria-label="Repetições do compasso ${index + 1}"></td>
            <td>
              <div class="row-actions">
                <button type="button" data-action="up" title="Mover para cima">↑</button>
                <button type="button" data-action="down" title="Mover para baixo">↓</button>
                <button type="button" data-action="duplicate" title="Duplicar">⧉</button>
                <button type="button" data-action="remove" title="Remover">×</button>
              </div>
            </td>
          `;
          tr.querySelectorAll("[data-field]").forEach(input => {
            input.addEventListener("change", e => {
              const field = e.target.dataset.field;
              this.updateMeasure(index, { [field]: parseInt(e.target.value, 10) });
            });
          });
          tr.querySelectorAll("[data-action]").forEach(button => {
            button.addEventListener("click", e => {
              const action = e.currentTarget.dataset.action;
              if (action === "up") this.moveMeasure(index, -1);
              if (action === "down") this.moveMeasure(index, 1);
              if (action === "duplicate") this.duplicateMeasure(index);
              if (action === "remove") this.removeMeasure(index);
            });
          });
          this.els.sequenceBody.appendChild(tr);
        });
        this.highlightActiveRow(this.sequencer.measureIndex);
      }

      renderRhythmGrid(activeEvent = this.sequencer.getSnapshot().currentEvent) {
        const snap = this.sequencer.getSnapshot();
        const measure = activeEvent?.measure || snap.measure || this.state.sequence[0] || defaultMeasure();
        const activePulse = activeEvent?.pulseIndex ?? -1;
        this.els.rhythmGrid.innerHTML = "";

        for (let beat = 1; beat <= measure.beats; beat++) {
          const row = document.createElement("div");
          row.className = "beat-row";
          const label = document.createElement("div");
          label.className = "beat-label";
          label.textContent = beat;
          const pulses = document.createElement("div");
          pulses.className = "pulse-row";
          pulses.style.gridTemplateColumns = `repeat(${measure.subdivision}, minmax(28px, 1fr))`;

          for (let sub = 0; sub < measure.subdivision; sub++) {
            const pulseIndex = (beat - 1) * measure.subdivision + sub;
            const cell = document.createElement("div");
            cell.className = "pulse";
            if (pulseIndex === activePulse) cell.classList.add("active");
            cell.title = `Tempo ${beat}, pulso ${sub + 1}`;
            cell.setAttribute("aria-label", `Tempo ${beat}, pulso ${sub + 1}`);
            pulses.appendChild(cell);
          }

          row.append(label, pulses);
          this.els.rhythmGrid.appendChild(row);
        }
      }

      highlightActiveRow(index) {
        this.els.sequenceBody.querySelectorAll("tr").forEach(row => {
          row.classList.toggle("active-measure", Number(row.dataset.index) === index);
        });
      }

      animationLoop() {
        // requestAnimationFrame só renderiza estado visual; o áudio permanece desacoplado.
        this.consumeDueEvents();
        const now = performance.now();
        this.els.bpmFlash.classList.toggle("flash", now < this.flashUntil);
        this.els.countInOverlay.classList.toggle("show", now < this.countOverlayUntil);
        this.updateProgress();
        requestAnimationFrame(() => this.animationLoop());
      }

      consumeDueEvents() {
        if (!this.audio.context) return;
        const now = this.audio.currentTime;
        while (this.scheduledEvents.length && this.scheduledEvents[0].time <= now + 0.015) {
          const event = this.scheduledEvents.shift();
          if (event.type === "count") {
            this.els.countInNumber.textContent = event.countNumber;
            this.countOverlayUntil = performance.now() + 180;
            this.flashUntil = performance.now() + 90;
            continue;
          }
          const key = `${event.cycleIndex}-${event.measureIndex}-${event.repeatIndex}-${event.pulseIndex}`;
          if (key !== this.lastVisualPulseKey) {
            this.lastVisualPulseKey = key;
            this.flashUntil = performance.now() + (event.subIndex === 0 ? 105 : 58);
            this.renderStatus(event);
            this.renderRhythmGrid(event);
          }
        }
      }

      updateProgress() {
        const event = this.sequencer.getSnapshot().currentEvent;
        if (!event) {
          this.els.cycleProgress.style.width = "0%";
          return;
        }
        const measureUnits = this.state.sequence.reduce((sum, measure, index) => {
          const current = index < event.measureIndex ? measure.beats * measure.subdivision * measure.repeats : 0;
          return sum + current;
        }, 0);
        const currentMeasure = event.measure.beats * event.measure.subdivision * event.repeatIndex + event.pulseInMeasure;
        const cyclePulses = this.state.sequence.reduce((sum, measure) => {
          return sum + measure.beats * measure.subdivision * measure.repeats;
        }, 0);
        const percent = cyclePulses ? ((measureUnits + currentMeasure) / cyclePulses) * 100 : 0;
        this.els.cycleProgress.style.width = `${clamp(percent, 0, 100)}%`;
      }
    }

    function defaultMeasure() {
      return { beats: 4, denominator: 4, subdivision: 1, repeats: 1 };
    }

    function sanitizeMeasure(measure) {
      const subdivision = SUBDIVISIONS[measure.subdivision] ? Number(measure.subdivision) : 1;
      return {
        beats: clampInt(measure.beats, 1, 16),
        denominator: [2, 4, 8, 16].includes(Number(measure.denominator)) ? Number(measure.denominator) : 4,
        subdivision,
        repeats: clampInt(measure.repeats ?? 1, 1, 64)
      };
    }

    function sanitizeSequence(sequence) {
      if (!Array.isArray(sequence) || sequence.length === 0) return [defaultMeasure()];
      return sequence.map(sanitizeMeasure);
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, Number(value) || min));
    }

    function clampInt(value, min, max) {
      return Math.round(clamp(parseInt(value, 10), min, max));
    }

    window.addEventListener("DOMContentLoaded", () => {
      window.metronomeApp = new AppUI();
    });
  </script>
</body>
</html>
